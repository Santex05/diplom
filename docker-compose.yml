# AniHex — полный стек (данные в ./docker-data, переносимы на другой ПК)
# Запуск: docker compose up -d --build
# Сайт: http://localhost

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anicatalog
      POSTGRES_PASSWORD: anicatalog
      POSTGRES_DB: anicatalog
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anicatalog -d anicatalog']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://anicatalog:anicatalog@db:5432/anicatalog
      ANIME_DIR: /data/anime
      VIDEO_TRANSCODE: ${VIDEO_TRANSCODE:-1}
      FFMPEG_CRF: ${FFMPEG_CRF:-28}
      FFMPEG_PRESET: ${FFMPEG_PRESET:-medium}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-1111}
    volumes:
      - ./docker-data/anime:/data/anime
      - ./docker-data/banners:/app/data/banners
      - ./docker-data/avatars:/app/data/avatars
      - ./docker-data/auth-page:/app/data/auth-page
    expose:
      - '3001'

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-80}:80'
